name: Android release

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a public GitHub Release for in-app updates
        required: false
        type: boolean
        default: false
      release_tag:
        description: Release tag (for example v1.1.0); required when publishing
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate-build-sign:
    name: Validate, build and sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate learning content
        run: python3 scripts/validate_content.py

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Lint and build signed release
        run: |
          set +e
          ./gradlew --no-daemon --console=plain lintRelease :app:assembleRelease :app:bundleRelease > build-output.log 2>&1
          STATUS=$?
          cat build-output.log
          if [ "$STATUS" -ne 0 ]; then
            grep -E -B 2 -A 6 'FAILURE:|error:|Error:|What went wrong|Execution failed|SDK location|Exception' build-output.log | tail -120 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$STATUS"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build-output.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          EXPECTED="$(grep 'Fingerprint=' signing/certificate-info.txt | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          "$APKSIGNER" verify --print-certs "$APK" | grep -Fi "$EXPECTED"

      - name: Resolve update release tag
        if: github.event_name == 'push' || inputs.publish_release
        id: release_info
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v$(grep '^versionName=' version.properties | cut -d= -f2)"
          fi
          case "$TAG" in v*) ;; *) echo "Release tag must start with v" >&2; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build in-app update metadata
        if: github.event_name == 'push' || inputs.publish_release
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          python3 scripts/create_update_metadata.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output app/build/outputs/update.json

      - name: Publish release for in-app updates
        if: github.event_name == 'push' || inputs.publish_release
        uses: softprops/action-gh-release@v2
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ПДД Беларусь ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/update.json
          fail_on_unmatched_files: true

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: pdd-belarus-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
